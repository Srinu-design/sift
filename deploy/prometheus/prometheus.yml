# Prometheus for the Sift + Hopper Compose stack: Hopper's own config (../hopper/deploy/prometheus,
# kept in step by hand) plus Sift's processes. Mounted over Hopper's file by docker/hopper.override.yaml,
# so Hopper's alerts.yml next to it still loads.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

# Docker's DNS answers a service name with one A record per replica, so a scaled service
# (docker compose up --scale worker=8) is discovered without a fixed target list.
scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: scheduler
    dns_sd_configs:
      - names: [scheduler]
        type: A
        port: 9100
        refresh_interval: 10s

  # Postgres itself, through postgres-exporter (connections, dead tuples, transactions).
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  # Sift: the query API and the ingest service serve /metrics on the internal port 9100.
  - job_name: sift-api
    dns_sd_configs:
      - names: [sift-api]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: sift-ingest
    dns_sd_configs:
      - names: [sift-ingest]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
