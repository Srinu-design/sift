# Sift and Hopper together. Run from the repo root:
#   docker compose -f docker/compose.yaml --env-file .env up -d --build     (make up)
# Hopper must be cloned next to this repo (../hopper), with its own .env (make env there).
name: sift

include:
  - path: [../../hopper/docker/compose.yaml, ./hopper.override.yaml]
    env_file: ../../hopper/.env

x-sift: &sift
  image: ${SIFT_IMAGE:-sift:dev}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file: ../.env
  environment: &sift-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hopper}:${POSTGRES_PASSWORD:-hopper}@postgres:5432/sift
    MODELS_URL: http://sift-models:8000
    HOPPER_URL: http://api:8000
    INGEST_URL: http://sift-ingest:8000
    FILE_STORE: /data/files
    REDIS_URL: redis://redis:6379/1      # db 1: Hopper uses db 0
  volumes:
    - hfcache:/home/app/.cache/huggingface   # models download once (week 7 bakes them in)
  init: true
  restart: unless-stopped

services:
  sift-migrate:
    <<: *sift
    restart: "no"
    command: ["sh", "-c", "python -m sift.db && alembic upgrade head"]
    depends_on:
      postgres: { condition: service_healthy }

  sift-models:
    <<: *sift
    command: ["uvicorn", "sift.models_svc.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:${MODELS_PORT:-8100}:8000"]   # dev only, for the eval on the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60                                   # the first start downloads the models

  # Internal only: no published port. Hopper's workers reach it by name on this network.
  sift-ingest:
    <<: *sift
    command: ["uvicorn", "sift.ingest.service:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - hfcache:/home/app/.cache/huggingface
      - ../data/files:/data/files:ro                # raw uploads; the host CLI writes them
    depends_on:
      sift-migrate: { condition: service_completed_successfully }
      sift-models: { condition: service_healthy }

  # The query API and the demo page. No auth until week 5: published on localhost only.
  sift-api:
    <<: *sift
    command: ["uvicorn", "sift.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:${API_PORT:-8200}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      sift-migrate: { condition: service_completed_successfully }
      sift-models: { condition: service_healthy }

  # Hopper workers for Sift's embedding queue only, sized to sift-models: 2 x 1 slot keeps
  # one batch encoding and one waiting, and killing one still leaves the other draining.
  hopper-embed-worker:
    image: ${HOPPER_IMAGE:-hopper:dev}
    env_file: ../../hopper/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hopper}:${POSTGRES_PASSWORD:-hopper}@postgres:5432/${POSTGRES_DB:-hopper}
      REDIS_URL: redis://redis:6379/0
      WORKER_QUEUES: sift-embed
      WORKER_SLOTS: "1"
    command: ["python", "-m", "hopper.worker"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    deploy: { replicas: 2 }
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  hfcache: {}
